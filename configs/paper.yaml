# Full configuration for the manuscript and comment attachment.
# Every parameter not taken from a cited source is a hypothetical scenario value.
name: paper
seed: 20261130
n_applicants: 20000
n_workers: 8

population:
  res_share_source: usaspending        # share of RES among RES+EEI awards, FY2021-2023
  award_share_of_cost: 0.25            # 7 CFR 4280.122(a)(3): cost sharing of at least 75 percent
  historical_award_share_of_cost: 0.25 # FY2021-2022 grants were limited to 25 percent of cost
  size_fit_fiscal_years: [2021, 2022]
  size_distribution: empirical         # empirical (resampled awards) or lognormal (fitted)
  max_request_res: 500000              # 4280.122(a)(2)(ii)
  max_request_eei: 250000
  min_request: 1500
  install_date_range: ["2007-05-01", "2014-10-31"]
  facility_types:                      # scenario_hypothetical mix of facility types
    warehouse: 0.15
    retailstandalone: 0.15
    smalloffice: 0.10
    fullservicerestaurant: 0.10
    scenario_hypothetical_irrigation: 0.15
    scenario_hypothetical_grain_drying: 0.20
    scenario_hypothetical_dairy: 0.15
  load:
    daily_noise_sd: 0.06               # lognormal sd of day-to-day multiplicative noise
    daily_noise_ar1: 0.5
    hourly_noise_sd: 0.10
    hvac_coef_log_sd: 0.30             # facility heterogeneity of temperature response
    balance_shift_sd_c: 1.5
    occupancy_change_prob: 0.15        # probability of a non-routine step change in base load
    occupancy_change_sd: 0.08
    occupancy_change_window_days: 300  # change falls within this many days of installation
    occupancy_factor_min: 0.5
  res:
    cost_per_watt_median: 2.6          # scenario_hypothetical installed cost, USD per W dc
    cost_per_watt_log_sd: 0.25
    replaced_fraction_range: [0.15, 1.30]
    tilt_range_deg: [5, 40]
    azimuth_mean_deg: 180
    azimuth_sd_deg: 30
    azimuth_range_deg: [90, 270]
    albedo: 0.2
    sapm_cell: [-3.56, -0.075, 3.0]    # SAPM open-rack glass/polymer parameters (a, b, deltaT)
    dc_ac_ratio: 1.2
    inverter_efficiency: 0.96
    system_losses: 0.14                # PVWatts default system losses
    temperature_coefficient: -0.0047   # per deg C, PVWatts v5 standard module
    derate_log_sd: 0.05                # system-specific performance spread
    shading_loss_max: 0.08
    irradiance_bias_sd: 0.05           # site irradiance relative to satellite-derived value
    meter_error_sd: 0.005
    storage_share: 0.10
    useful_life_years: 25
    netting_arrangements:
      conventional_net_metering: 0.6
      net_billing: 0.3
      none: 0.1
  eei:
    measures:                          # reduction ranges applied to affected end uses
      eei_lighting: {end_uses: [interior_lighting, exterior_lighting], reduction: [0.30, 0.60]}
      eei_hvac: {end_uses: [cooling, heating, fans_pumps], reduction: [0.15, 0.35]}
      eei_refrigeration: {end_uses: [refrigeration], reduction: [0.15, 0.40]}
      eei_motors_pumps: {end_uses: [fans_pumps, process], reduction: [0.15, 0.35]}
      eei_grain_drying: {end_uses: [drying], reduction: [0.25, 0.50]}
      eei_irrigation: {end_uses: [pumping], reduction: [0.15, 0.40]}
    payback_median_years: 6.0
    payback_log_sd: 0.5
    payback_min_years: 0.5
    reported_share_noise_sd: 0.10      # error of the end-use share stated in the audit
    useful_life_years: 15
    min_savings_fraction: 0.03

billing:
  cycle_mean_days: 30.4375            # scheduled reads once per month
  read_jitter_days: 2                  # read date varies around the schedule
  estimated_read_prob: 0.05
  estimate_noise_sd: 0.10
  charge_noise_sd: 0.03                # bill-to-bill variation of the effective energy rate
  history_days_before: 830             # simulated billing history around the in-service day
  history_days_after: 420
  fixed_charge_usd: 25.0
  transcription_rounding: 1            # bills transcribed to whole kWh

errors:
  # scenario_hypothetical class rates; not estimates of REAP error prevalence
  rates:
    unit: 0.04
    transposed_digits: 0.05
    wrong_period: 0.05
    double_counting: 0.04
    gross_net: 0.05
    nameplate_hours: 0.05
  second_meter_fraction_range: [0.15, 0.60]
  second_meter_noise_sd: 0.1
  unit_factor: 1000                    # kWh/MWh confusion
  variant_probability: 0.5             # split between the two variants of a class
  transposed_targets_res: {claim: 0.4, inverter: 0.3, pre_bill: 0.3}
  transposed_targets_eei: {pre_bill: 0.5, post_bill: 0.5}
  straddle_shift_max_bills: 3
  correction_success: 1.0              # flagged submissions are corrected on resubmission

validation:
  capacity_factor_bounds_rel: [0.5, 1.4]   # relative to modelled yield at the site
  billing_days_total: [350, 380]
  billing_days_each: [25, 36]
  period_alignment_days: 45
  payback_lower_bound_years: 0.25
  payback_upper_multiple: 4.0          # multiple of useful life treated as implausible
  claim_recompute_tolerance: 0.02
  enduse_bound_tolerance: 0.05
  statistical_rule_fpr: 0.01           # thresholds of statistical rules are set to this
                                       # false-positive rate on error-free submissions
  charge_consistency_tolerance: 0.25
  estimated_share_max: 0.25
  outlier_scale_floor: 0.05
  export_excess_tolerance: 0.02
  export_equal_tolerance: 0.005
  cvrmse_max: 0.25                     # diagnostic threshold for monthly baseline models
  ndb_max: 0.005

mv:
  balance_grid_f: [30, 90, 3]          # CalTRACK 2.0 search range and maximum step
  daily_heating_grid_f: [40, 70, 3]
  daily_cooling_grid_f: [55, 85, 3]
  confidence: 0.90
  bootstrap_replicates: 200
  bootstrap_block: 3
  bootstrap_subsample: 2000             # applicants with index below this get bootstrap intervals
  default_tilt_deg: 20
  default_azimuth_deg: 180
  min_nonzero_periods: 3               # periods with non-zero degree days needed for a slope
  pvwatts_annual_tolerance: 0.03       # acceptance limits of the PVWatts verification test
  pvwatts_monthly_tolerance: 0.06

competition:
  # scenario_hypothetical competition; funds expressed relative to total requests
  n_applicants: 2000
  n_competitions: 400
  funding_ratio: 0.35
  funding_ratio_sensitivity: [0.15, 0.35, 0.60]
  top_per_state: 2
  small_request_threshold: 20000       # 4280.150(a)
  small_request_reserve_share: 0.20
  minimum_score: 40                    # 4280.150
  points:
    employees_prob: 0.5
    critical_service_prob: 0.15
    forest_point_prob: 0.05
    water_point_prob: 0.10
    prior_award_probs: {never: 0.75, not_within_two_years: 0.15, within_two_years: 0.10}
    priority_points_values: [0, 5, 10]
    priority_points_probs: [0.6, 0.3, 0.1]

burden:
  # minutes of respondent time; triangular (low, mode, high); scenario_hypothetical
  # except where a source is given in docs/data.md
  anchor_responses: 2                  # evidence treated as two responses of average size
  calibrate_to_notice: true
  rework_minutes: [10, 20, 45]         # time to resolve one flagged submission
  elements:
    required_evidence:
      locate_bills: [15, 30, 60]
      bill_energy_per_bill: [0.5, 1.0, 2.0]
      annual_claim: [5, 10, 20]
      rated_capacity: [1, 2, 5]
      energy_price: [10, 20, 40]
    optional:
      billing_dates: {per_bill: [0.25, 0.5, 1.0]}
      read_type: {per_bill: [0.1, 0.25, 0.5]}
      bill_charges: {per_bill: [0.4, 0.75, 1.5]}
      meter_ids: {fixed: [2, 5, 10]}
      res_post_bills: {per_post_bill: [0.5, 1.0, 2.0], applies_to: RES}
      export_channel: {per_post_bill: [0.25, 0.5, 1.0], fixed: [1, 3, 6], applies_to: RES}
      inverter_monthly: {fixed: [8, 15, 30], applies_to: RES}
      pv_geometry: {fixed: [2, 5, 15], applies_to: RES}
      inverter_interval: {fixed: [10, 20, 45], applies_to: RES}
      enduse_share: {fixed: [5, 10, 20], applies_to: EEI}
      claim_method: {fixed: [1, 2, 5]}
      utility_interval: {fixed: [15, 30, 90]}
      weather_normalization: {fixed: [0, 0, 0]}   # computed by the Agency from dates and location
  modes:
    manual_transcription: {}
    utility_file_upload: {bill_block_minutes: [10, 15, 30]}
    green_button_download: {bill_block_minutes: [10, 15, 30], includes_interval: true}
    automated_utility_access: {bill_block_minutes: [3, 5, 10], includes_interval: true}
  monte_carlo_draws: 2000
  sobol_base_samples: 4096

experiments:
  are_cap: 1.0                         # cap on absolute relative error in the accuracy loss
  error_share_thresholds: [0.10, 0.50]
  savings_bands: [0.10, 0.20]
  e4_bins: 8
  recall_fpr: 0.05
  surrogate_sample: 600
  ilp_budgets: 8
  mip_gap: 0.0001
  frontier_budget_points: 60
  convergence_points: 12
  convergence_min_n: 100
  e4_min_per_bin: 30
  e5_missing_months: [0, 1, 2, 3]
  e5_estimated_read_probs: [0.0, 0.1, 0.3, 0.5]
  e5_subsample: 1500
  e3_rate_multipliers: [0.5, 1.0, 2.0]
  roc_points: 60
  bootstrap_replicates: 1000
  frontier_mc_bands: [0.05, 0.95]
  recommended_tolerance: 0.05          # share of the attainable loss reduction that may be forgone
  size_sensitivity_n: 4000
  e3_per_class: 2000
  evidence_sample: 5
  noise_scenarios:                     # multipliers on load noise and on the probability of a
    low: {noise_multiplier: 0.5, occupancy_multiplier: 0.0}    # non-routine change
    high: {noise_multiplier: 2.0, occupancy_multiplier: 2.0}
  availability_grid: [0.0, 0.25, 0.5, 0.75, 1.0]

hypothesis_tests:
  # pre-specified paired comparisons; Holm correction across the family
  alpha: 0.05
  correction: holm
  family:
    - {id: H1, description: "Dated monthly bills with normalization vs interval data (EEI absolute relative error)", a: eei_normalized_monthly, b: eei_interval}
    - {id: H2, description: "Normalized vs unnormalized dated monthly bills (EEI absolute relative error)", a: eei_normalized_monthly, b: eei_dated}
    - {id: H3, description: "Dated vs undated monthly bills (EEI absolute relative error)", a: eei_dated, b: eei_undated}
    - {id: H4, description: "Dated vs undated pre-period consumption (absolute relative error)", a: cpre_dated, b: cpre_undated}
