name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.5"
      - name: Install environment
        run: uv sync --frozen --extra dev
      - name: Lint
        run: uv run ruff check src scripts figures tests
      - name: Type check
        run: uv run mypy src
      - name: Fetch and process inputs
        run: |
          uv run python scripts/fetch_data.py
          uv run python -m reapschema.data.process
      - name: Tests
        run: uv run pytest
      - name: Reduced pipeline
        run: make quick PY="uv run python"
      - name: Reference check
        run: uv run python scripts/check_refs.py paper/references.bib
